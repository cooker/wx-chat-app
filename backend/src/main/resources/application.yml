spring:
  application:
    name: wx-chat-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:./wx-chat.db
  sql:
    init:
      mode: always
      # SQLite: ALTER below may repeat columns already created on fresh DB; ignore duplicates only.
      continue-on-error: true

mybatis:
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8384

app:
  # 可由 start.sh 设置 APP_UPLOAD_DIR / APP_ALBUM_IMAGE_DIR 为绝对路径（推荐服务器部署）
  upload-dir: ${APP_UPLOAD_DIR:./uploads}
  album-image-dir: ${APP_ALBUM_IMAGE_DIR:./uploads/albums}
  admin:
    auth-enabled: true
    password: ${ADMIN_PASSWORD:admin123}
